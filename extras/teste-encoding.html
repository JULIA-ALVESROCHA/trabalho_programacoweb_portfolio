<head>
  <!--
    Lista 1, Ex. 5: experimento com codificação de caracteres.
    Este arquivo foi salvo em UTF-8, mas a meta tag abaixo diz windows-1252 (ISO-8859-1).
    Por isso o navegador lê os bytes errado e os acentos quebram.
    Para corrigir, troque para: <meta charset="utf-8">
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de codificação</title>
